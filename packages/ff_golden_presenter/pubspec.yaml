name: ff_golden_presenter
description: Review local Git golden changes, run filtered tests, and publish searchable HTML reports.
version: 1.1.1
homepage: https://asodevapp.github.io/golden/
repository: https://github.com/asodevapp/golden
issue_tracker: https://github.com/asodevapp/golden/issues
documentation: https://asodevapp.github.io/golden/presenter/
topics:
  - cli
  - docker
  - golden-tests
  - html
  - image-optimization

screenshots:
  - description: Searchable live golden report with summary metrics, scenario navigation, and device, theme, and locale filters.
    path: screenshots/live-report.jpg
  - description: Local Git diff review comparing dark and light golden images side by side before staging.
    path: screenshots/diff-viewer.jpg

executables:
  ff_golden_presenter:

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  analyzer: '>=7.0.0 <14.0.0'
  args: ^2.7.0
  crypto: ^3.0.6
  path: ^1.9.1

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.15
