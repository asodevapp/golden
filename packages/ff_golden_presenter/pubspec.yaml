name: ff_golden_presenter
description: Review local Git golden changes, run filtered tests, and publish searchable HTML reports.
version: 1.1.0
homepage: https://asodevapp.github.io/golden/
repository: https://github.com/asodevapp/golden
issue_tracker: https://github.com/asodevapp/golden/issues
documentation: https://asodevapp.github.io/golden/presenter/
topics:
  - cli
  - docker
  - golden-tests
  - html
  - image-optimization

executables:
  ff_golden_presenter:

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  analyzer: '>=7.0.0 <14.0.0'
  args: ^2.7.0
  crypto: ^3.0.6
  path: ^1.9.1

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.15
