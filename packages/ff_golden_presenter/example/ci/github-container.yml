---
name: Publish golden report container to GHCR

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            SDK_IMAGE=ghcr.io/cirruslabs/flutter:stable
            PUB_GET_COMMAND=flutter pub get
            GOLDEN_INPUT=test/screens
            REPORT_TITLE=Golden report — ${{ github.sha }}
            OPTIMIZATION_PROFILE=balanced
            INSTALL_TOOLS=true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
