name: ff_golden
description: Deterministic Flutter golden testing with scenario flows, device fidelity, coverage sampling, and strict diagnostics.
version: 1.2.0
homepage: https://asodevapp.github.io/golden/
documentation: https://asodevapp.github.io/golden/getting-started/
repository: https://github.com/asodevapp/golden
issue_tracker: https://github.com/asodevapp/golden/issues
topics:
  - flutter
  - testing
  - golden-tests
  - ui-testing
  - snapshot-testing

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

resolution: workspace

executables:
  ff_golden:

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  meta: ^1.7.0
  path: ^1.9.1

dev_dependencies:
  ff_golden_presenter: ^1.0.0
  flutter_lints: ^5.0.0
