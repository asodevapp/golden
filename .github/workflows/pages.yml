---
name: Deploy FF Golden demo to GitHub Pages

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ff-golden-demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the FF Golden Presenter demo
        run: >-
          flutter pub run ff_golden_presenter:ff_golden_presenter build
          --input example/goldens
          --output-directory build/pages
          --profile none
          --clean
          --title "FF Golden — Flutter visual regression testing"
        working-directory: packages/ff_golden_presenter
      - name: Verify the publication artifact
        run: |
          test -f build/pages/index.html
          grep -Fq 'href="https://aso.dev/' build/pages/index.html
          grep -Fq 'rel="sponsored noopener"' build/pages/index.html
        working-directory: packages/ff_golden_presenter
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/ff_golden_presenter/build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
